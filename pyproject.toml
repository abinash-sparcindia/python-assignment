[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-assets"
version = "0.1.0"
description = "Survey ingestion and asset API for an electricity utility"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "fastapi==0.115.12",
    "psycopg[binary]==3.2.6",
    "SQLAlchemy==2.0.40",
    "uvicorn==0.34.2",
]

[project.scripts]
utility-assets-import = "utility_assets.cli:main"

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
